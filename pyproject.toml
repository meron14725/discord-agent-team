[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-agent-team"
version = "0.1.0"
description = "Discord-driven, approval-gated engineering team"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1",
  "PyJWT[crypto]>=2.10,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
agent-team = "agent_team.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
[tool.hatch.build.targets.wheel]
packages = ["src/agent_team"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
